name: Build beta
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore: ['README.md']
permissions:
  contents: read
jobs:
  build:
    name: Build beta mod and server packages
    uses: ./.github/workflows/build-packages.yml
    with:
      artifact-suffix: beta-${{ github.run_id }}
      display-name: Multiplayer [Continuous]
  release:
    name: Publish beta release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Check out release metadata
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download combined mod package
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.mod-artifact }}
        path: output
    - name: Download combined server package
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.server-artifact }}
        path: output
    - name: Package release ZIPs
      working-directory: output
      run: |
        zip -r ../Multiplayer-beta.zip Multiplayer/
        zip -r ../Server-beta.zip Server/
    - name: Remove previous release
      continue-on-error: true
      run: gh release delete --cleanup-tag --yes continuous
    - name: Publish release
      run: |
        gh release create --target "${{ github.sha }}" --title Continuous --notes-file .github/workflows/alpha-notes.md --draft continuous
        gh release upload continuous Multiplayer-beta.zip Server-beta.zip
        gh release edit continuous --draft=false
