name: Build beta

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.md'

jobs:
  build:
    name: Build beta
    runs-on: ubuntu-latest
    env:
        GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Setup Dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
      
    - name: Restore and build RimWorld 1.6
      run: |
        dotnet restore Source/Multiplayer.sln -p:RimWorldVersion=1.6
        dotnet build Source/Multiplayer.sln --configuration Release --no-restore -p:RimWorldVersion=1.6

    - name: Restore and build RimWorld 1.7
      run: |
        dotnet restore Source/Multiplayer.sln -p:RimWorldVersion=1.7
        dotnet build Source/Multiplayer.sln --configuration Release --no-restore -p:RimWorldVersion=1.7

    - name: Publish Server 1.6 and 1.7 (Windows)
      run: |
        dotnet publish Source/Server/Server.csproj --configuration Release --runtime win-x64 --self-contained false -p:UseAppHost=true -p:RimWorldVersion=1.6 -o output/Server/Windows
        dotnet publish Source/Server/Server.csproj --configuration Release --runtime win-x64 --self-contained false -p:UseAppHost=true -p:RimWorldVersion=1.7 -o output/Server/1.7/Windows

    - name: Publish Server 1.6 and 1.7 (Linux)
      run: |
        dotnet publish Source/Server/Server.csproj --configuration Release --runtime linux-x64 --self-contained false -p:UseAppHost=true -p:RimWorldVersion=1.6 -o output/Server/Linux
        dotnet publish Source/Server/Server.csproj --configuration Release --runtime linux-x64 --self-contained false -p:UseAppHost=true -p:RimWorldVersion=1.7 -o output/Server/1.7/Linux

    - name: Add Server Launchers
      run: |
        for directory in output/Server/Linux output/Server/1.7/Linux; do
          cat > "$directory/Server.sh" <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
        exec dotnet "$SCRIPT_DIR/Server.dll" "$@"
        EOF
          chmod +x "$directory/Server.sh"
        done

    - name: Stage versioned Multiplayer mod
      run: bash .github/scripts/stage-multiplayer-beta.sh output/Multiplayer

    - name: Package files
      run: |
        cd output/
        zip -r ../Multiplayer-beta.zip Multiplayer/
        zip -r ../Server-beta.zip Server/
        cd ../

    - name: Upload Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Multiplayer-beta
        path: output/
    
    - name: Clean up last release
      continue-on-error: true
      run: |
        gh release delete --cleanup-tag --yes "continuous"
    
    - name: Upload new release
      run: |
        gh release create --target "${{ github.sha }}" --title "Continuous" --notes-file ".github/workflows/alpha-notes.md" --draft "continuous"
        gh release upload "continuous" Multiplayer-beta.zip Server-beta.zip
        gh release edit "continuous" --draft=false
