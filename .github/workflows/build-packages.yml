name: Build release packages
on:
  workflow_call:
    inputs:
      artifact-suffix:
        required: true
        type: string
      display-name:
        default: ''
        type: string
      stamp-version:
        default: false
        type: boolean
      include-servers:
        default: true
        type: boolean
    outputs:
      mod-artifact:
        value: ${{ jobs.package.outputs.mod-artifact }}
      server-artifact:
        value: ${{ jobs.package.outputs.server-artifact }}
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.config.outputs.current }}
      releases: ${{ steps.config.outputs.releases }}
      versions: ${{ steps.config.outputs.versions }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - id: config
      name: Read supported version builds
      run: |
        python3 - <<'PYTHON'
        import json
        import os
        import re
        from pathlib import Path
        config = json.loads(Path('.github/package-versions.json').read_text())
        versions = [config['current']] + [entry['version'] for entry in config['releases']]
        if len(set(versions)) != len(versions) or any(not re.fullmatch(r'\d+\.\d+', value) for value in versions):
            raise SystemExit('Package versions must be unique major.minor values')
        for entry in config['releases']:
            if not entry.get('branch'):
                raise SystemExit('Each release source must name an upstream branch')
            if entry.get('fallback') and not re.fullmatch(r'[0-9a-f]{40}', entry['fallback']):
                raise SystemExit('Fallbacks must be full commit SHAs')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f"current={config['current']}\n")
            output.write('versions=' + json.dumps(versions) + '\n')
            output.write('releases=' + json.dumps(config['releases'], separators=(',', ':')) + '\n')
        PYTHON
  current:
    needs: configuration
    env:
      GAME_VERSION: ${{ needs.configuration.outputs.current }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: recursive
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Build current mod
      run: dotnet build Source/Client/Multiplayer.csproj -c Release
    - name: Stage current mod
      run: |
        destination="artifacts/mod-build/$GAME_VERSION"
        mkdir -p "$destination/files"
        cp -R About "$destination/"
        cp -R Defs Languages Textures "$GAME_VERSION/Assemblies" "$GAME_VERSION/AssembliesCustom" "$destination/files/"
        rm -rf "$destination/files/Languages/.git"
        git rev-parse HEAD > "$destination/files/source-commit.txt"
    - name: Audit current assembly references
      run: dotnet run --project Source/RuntimeTests/MetadataAudit.csproj -c Release -- "artifacts/mod-build/$GAME_VERSION/files"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mod-build-${{ env.GAME_VERSION }}-${{ inputs.artifact-suffix }}
        path: artifacts/mod-build/
        if-no-files-found: error
        retention-days: 7
    - name: Publish current servers
      if: inputs.include-servers
      run: |
        for os in win linux; do
          dotnet publish Source/Server/Server.csproj -c Release -r "$os-x64" --self-contained false -p:UseAppHost=true -o "artifacts/server/Server/$GAME_VERSION/$(if [[ $os == win ]]; then echo Windows; else echo Linux; fi)"
        done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: inputs.include-servers
      with:
        name: server-build-${{ env.GAME_VERSION }}-${{ inputs.artifact-suffix }}
        path: artifacts/server/
        retention-days: 7
        if-no-files-found: error
  versions:
    needs: configuration
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.configuration.outputs.releases) }}
    env:
      GAME_VERSION: ${{ matrix.source.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Resolve version source
      id: source
      env:
        SOURCE_BRANCH: ${{ matrix.source.branch }}
        SOURCE_FALLBACK: ${{ matrix.source.fallback || '' }}
      run: |
        if refs=$(git ls-remote --exit-code --heads https://github.com/rwmt/Multiplayer.git "refs/heads/$SOURCE_BRANCH"); then
          sha=${refs%%$'\t'*}
          echo "Using $SOURCE_BRANCH at $sha"
        else
          status=$?
          if [[ "$status" != 2 ]]; then
            echo "Could not check the source branch (git exit $status)" >&2
            exit "$status"
          fi
          if [[ -z "$SOURCE_FALLBACK" ]]; then
            echo "Required branch $SOURCE_BRANCH does not exist and has no fallback" >&2
            exit 1
          fi
          sha=$SOURCE_FALLBACK
          echo "No $SOURCE_BRANCH branch; using pinned commit $sha"
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: Checkout version source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: rwmt/Multiplayer
        ref: ${{ steps.source.outputs.sha }}
        path: version-src
        persist-credentials: false
        submodules: recursive
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Build version mod
      working-directory: version-src
      run: dotnet build Source/Client/Multiplayer.csproj -c Release
    - name: Stage version mod
      env:
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
        SOURCE_CONFIG: ${{ toJSON(matrix.source) }}
      run: |
        destination="artifacts/mod-build/$GAME_VERSION"
        mkdir -p "$destination/files"
        cp -R version-src/About "$destination/"
        for directory in Assemblies AssembliesCustom Defs Languages Textures; do
          cp -R "version-src/$directory" "$destination/files/"
        done
        rm -rf "$destination/files/Languages/.git"
        echo "$SOURCE_SHA" > "$destination/files/source-commit.txt"
        printf '%s\n' "$SOURCE_CONFIG" > "$destination/source.json"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mod-build-${{ env.GAME_VERSION }}-${{ inputs.artifact-suffix }}
        path: artifacts/mod-build/
        retention-days: 7
        if-no-files-found: error
    - name: Publish version servers
      if: inputs.include-servers
      working-directory: version-src
      run: |
        for os in win linux; do
          dotnet publish Source/Server/Server.csproj -c Release -r "$os-x64" --self-contained false -p:UseAppHost=true -o "../artifacts/server/Server/$GAME_VERSION/$(if [[ $os == win ]]; then echo Windows; else echo Linux; fi)"
        done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: inputs.include-servers
      with:
        name: server-build-${{ env.GAME_VERSION }}-${{ inputs.artifact-suffix }}
        path: artifacts/server/
        retention-days: 7
        if-no-files-found: error
  package:
    needs: [configuration, current, versions]
    runs-on: ubuntu-latest
    outputs:
      mod-artifact: ${{ steps.names.outputs.mod }}
      server-artifact: ${{ steps.names.outputs.server }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        pattern: mod-build-*-${{ inputs.artifact-suffix }}
        path: bundle
        merge-multiple: true
    - name: Package mod
      uses: ./.github/actions/package-mod
      with:
        destination: artifacts/mod/Multiplayer
        builds-root: bundle
        versions: ${{ needs.configuration.outputs.versions }}
        current-version: ${{ needs.configuration.outputs.current }}
        display-name: ${{ inputs.display-name }}
        stamp-version: ${{ inputs.stamp-version }}
    - id: names
      env:
        SUFFIX: ${{ inputs.artifact-suffix }}
      run: |
        echo "mod=Multiplayer-mod-$SUFFIX" >> "$GITHUB_OUTPUT"
        echo "server=Multiplayer-server-$SUFFIX" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.names.outputs.mod }}
        path: artifacts/mod/
        retention-days: 7
        if-no-files-found: error
    - uses: actions/download-artifact@v4
      if: inputs.include-servers
      with:
        pattern: server-build-*-${{ inputs.artifact-suffix }}
        path: artifacts/server
        merge-multiple: true
    - name: Add Linux server launchers
      if: inputs.include-servers
      run: |
        for directory in artifacts/server/Server/*/Linux; do
          cat > "$directory/Server.sh" <<'EOF'
        #!/usr/bin/env bash
        # Run the server beside this script with the supplied arguments.
        set -euo pipefail
        SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
        exec dotnet "$SCRIPT_DIR/Server.dll" "$@"
        EOF
          chmod +x "$directory/Server.sh"
        done
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: inputs.include-servers
      with:
        name: ${{ steps.names.outputs.server }}
        path: artifacts/server/
        retention-days: 7
        if-no-files-found: error
