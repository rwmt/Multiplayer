name: Build workshop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build workshop
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive # Updates the Languages submodule
    
    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'
      
    - name: Build versioned mod
      run: |
        for version in 1.6 1.7; do
          dotnet build Source/Client/Multiplayer.csproj --configuration Release -p:RimWorldVersion="$version"
        done

    - name: Package mod files
      uses: ./.github/actions/package-mod
      with:
        destination: output/Multiplayer
        stamp-version: 'true'

    - id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

    - name: Upload mod artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Multiplayer-${{ steps.get_version.outputs.VERSION }}
        path: |
          output/
