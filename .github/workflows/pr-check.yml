# Based on workflow from https://github.com/krafs/LevelUp

name: Validate Pull Request

env:
  SLN_PATH: Source/

on:
  pull_request

jobs:
  builds:
    name: Builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
    
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.x
      env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: true

    - name: Display SDK version
      run: dotnet --version

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    - name: Build debug
      run: dotnet build ${{ env.SLN_PATH }} --no-restore   
             
    - name: Build release
      run: dotnet build ${{ env.SLN_PATH }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SLN_PATH }} --no-restore

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/**'
        retention-days: 7
