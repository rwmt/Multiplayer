# Based on workflow from https://github.com/krafs/LevelUp

name: Validate Pull Request

env:
  SLN_PATH: Source/

on:
  pull_request

jobs:
  builds:
    name: Builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    steps:
    
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.x
      env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: true

    - name: Display SDK version
      run: dotnet --version

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SLN_PATH }}

    - name: Build debug
      run: dotnet build ${{ env.SLN_PATH }} --no-restore   
             
    - name: Build release
      run: dotnet build ${{ env.SLN_PATH }} --configuration Release --no-restore

    - name: Run tests
      run: dotnet test ${{ env.SLN_PATH }} --no-restore --logger "trx;logfilename=TestResults.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ matrix.os }}
        path: '**/TestResults/**'
        retention-days: 7
