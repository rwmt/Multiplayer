# Based on workflow from https://github.com/krafs/LevelUp

name: Validate Pull Request

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  builds:
    name: Builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Restore dependencies
      run: dotnet restore Source/Multiplayer.sln

    - name: Build debug
      run: dotnet build Source/Multiplayer.sln -c Debug --no-restore

    - name: Build release
      run: dotnet build Source/Multiplayer.sln -c Release --no-restore

    - name: Run tests
      run: >-
        dotnet test Source/Tests/Tests.csproj -c Release --no-build --no-restore
        --logger "trx;LogFileName=TestResults.trx"
        --results-directory artifacts/test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-rimworld-1.7
        path: artifacts/test-results/
        retention-days: 7
        if-no-files-found: warn
        overwrite: true

  # Independent of tests so buildable PRs still supply reproduction packages.
  package-artifacts:
    uses: ./.github/workflows/build-packages.yml
    with:
      artifact-suffix: pr${{ github.event.pull_request.number }}-${{ github.sha }}
      display-name: "Multiplayer [PR #${{ github.event.pull_request.number }}]"
